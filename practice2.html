<!--CSS Update Page: Allows users to modify the CSS format to change the text color and width. [20 points]-->

<!DOCTYPE html>

<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="control-panel">
    <h2>CSS Style Controls</h2>
    
    <!-- 1. Text RGB Input (Accepts format like: 255, 99, 71) -->
    <div class="control-group">
        <label for="textRgbInput">Text RGB Value:</label>
        <input type="text" id="textRgbInput" placeholder="e.g., 0, 123, 255" oninput="updateStyles()">
    </div>

    <!-- 2. Border RGB Input -->
    <div class="control-group">
        <label for="borderRgbInput">Border RGB Value:</label>
        <input type="text" id="borderRgbInput" placeholder="e.g., 220, 53, 69" oninput="updateStyles()">
    </div>

    <!-- 3. Border Width Slider -->
    <div class="control-group">
        <label for="borderWidthSlider">Border Width (px):</label>
        <input type="range" id="borderWidthSlider" min="0" max="25" value="2" oninput="updateStyles()">
        <span id="widthValue">2px</span>
    </div>
</div>

<!-- The target content paragraph box that will change dynamically -->
<div id="dynamicParagraph" class="content-box">
    <h3>Live Preview Area</h3>
    <p>This paragraph text and its border will instantly adjust their properties based on the configurations you enter into the control fields above.</p>
</div>

<script>
function updateStyles() {
    // Grab all field inputs
    var textRGB = document.getElementById("textRgbInput").value;
    var borderRGB = document.getElementById("borderRgbInput").value;
    var borderWidth = document.getElementById("borderWidthSlider").value;
    
    var targetBox = document.getElementById("dynamicParagraph");
    
    // Update the visual slider label indicator
    document.getElementById("widthValue").innerText = borderWidth + "px";
    
    // 1. Dynamic Text Color Update
    if (textRGB.trim() !== "") {
        targetBox.style.color = "rgb(" + textRGB + ")";
    }
    
    // 2. Dynamic Border Color Update
    if (borderRGB.trim() !== "") {
        targetBox.style.borderColor = "rgb(" + borderRGB + ")";
    }
    
    // 3. Dynamic Border Width Update
    targetBox.style.borderWidth = borderWidth + "px";
}
</script>

</body>
</html>
